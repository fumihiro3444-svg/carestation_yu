<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="注射器のキャラクターと、おばあちゃん、子どもが笑顔で並んでいるイラスト" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <path id="heart" d="M0 -6 C-12 -18 -22 0 0 14 C22 0 12 -18 0 -6Z"/>
    <g id="flake" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-10" x2="0" y2="10"/><line x1="-9" y1="-5" x2="9" y2="5"/><line x1="-9" y1="5" x2="9" y2="-5"/>
    </g>
  </defs>

  <rect width="720" height="320" rx="24" fill="#e6f1ed"/>
  <!-- 背景のくも・雪・ハート -->
  <ellipse cx="90" cy="95" rx="38" ry="16" fill="#fff" opacity=".8"/>
  <ellipse cx="115" cy="88" rx="26" ry="14" fill="#fff" opacity=".8"/>
  <ellipse cx="640" cy="105" rx="38" ry="16" fill="#fff" opacity=".8"/>
  <ellipse cx="618" cy="98" rx="24" ry="13" fill="#fff" opacity=".8"/>
  <use href="#flake" x="60" y="180"/><use href="#flake" x="665" y="190"/>
  <use href="#flake" x="270" y="95"/><use href="#flake" x="455" y="100"/>
  <use href="#flake" x="40" y="270"/><use href="#flake" x="690" y="275"/>
  <use href="#heart" x="285" y="150" fill="#f4a6a0" transform="translate(285 150) scale(.7) translate(-285 -150)"/>
  <use href="#heart" x="445" y="145" fill="#f4a6a0" transform="translate(445 145) scale(.9) translate(-445 -145)"/>
  <use href="#heart" x="475" y="115" fill="#f7c7c2" transform="translate(475 115) scale(.5) translate(-475 -115)"/>

  <!-- タイトル -->
  <text x="360" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#2f6f5e"
        font-family="'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif">ワクチンで　元気に　冬をのりきろう</text>

  <!-- 地面 -->
  <ellipse cx="170" cy="305" rx="95" ry="9" fill="#2f6f5e" opacity=".12"/>
  <ellipse cx="360" cy="305" rx="55" ry="8" fill="#2f6f5e" opacity=".12"/>
  <ellipse cx="550" cy="305" rx="85" ry="9" fill="#2f6f5e" opacity=".12"/>

  <!-- おばあちゃん -->
  <g>
    <ellipse cx="170" cy="278" rx="72" ry="48" fill="#f4a6a0"/>
    <path d="M170 240 L170 300" stroke="#e58f88" stroke-width="3"/>
    <circle cx="160" cy="268" r="4" fill="#fff"/><circle cx="180" cy="268" r="4" fill="#fff"/>
    <circle cx="170" cy="112" r="21" fill="#ececf1"/>
    <circle cx="170" cy="168" r="60" fill="#ececf1"/>
    <circle cx="170" cy="182" r="50" fill="#ffe3cc"/>
    <path d="M122 168 q48 -42 96 0 q-10 -26 -48 -26 q-38 0 -48 26z" fill="#ececf1"/>
    <circle cx="157" cy="182" r="13" fill="none" stroke="#8a6a4a" stroke-width="2.5"/>
    <circle cx="183" cy="182" r="13" fill="none" stroke="#8a6a4a" stroke-width="2.5"/>
    <line x1="170" y1="182" x2="170" y2="182" stroke="#8a6a4a" stroke-width="2.5"/>
    <path d="M150 183 q7 -8 14 0" fill="none" stroke="#5a3a2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M176 183 q7 -8 14 0" fill="none" stroke="#5a3a2a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="140" cy="198" r="8" fill="#f4a6a0" opacity=".6"/>
    <circle cx="200" cy="198" r="8" fill="#f4a6a0" opacity=".6"/>
    <path d="M161 199 q9 10 18 0" fill="none" stroke="#5a3a2a" stroke-width="3" stroke-linecap="round"/>
    <!-- 絆創膏 -->
    <g transform="translate(120 262) rotate(-25)">
      <rect x="-16" y="-7" width="32" height="14" rx="7" fill="#f7d9a8" stroke="#e3c26a" stroke-width="1.5"/>
      <rect x="-6" y="-7" width="12" height="14" fill="#fff4d6"/>
    </g>
  </g>

  <!-- 注射器キャラクター -->
  <g transform="translate(360 192) rotate(-12) scale(.85) translate(-360 -170)">
    <rect x="340" y="44" width="40" height="12" rx="6" fill="#2f6f5e"/>
    <rect x="356" y="56" width="8" height="22" fill="#2f6f5e"/>
    <rect x="322" y="76" width="76" height="9" rx="4.5" fill="#2f6f5e"/>
    <rect x="330" y="84" width="60" height="158" rx="14" fill="#fff" stroke="#2f6f5e" stroke-width="3"/>
    <rect x="334" y="140" width="52" height="98" rx="11" fill="#8fd3bf"/>
    <line x1="334" y1="110" x2="346" y2="110" stroke="#2f6f5e" stroke-width="2"/>
    <line x1="334" y1="125" x2="342" y2="125" stroke="#2f6f5e" stroke-width="2"/>
    <rect x="352" y="242" width="16" height="12" fill="#2f6f5e"/>
    <rect x="357" y="254" width="6" height="30" fill="#9aa5a2"/>
    <path d="M357 284 L363 284 L360 296 Z" fill="#9aa5a2"/>
    <circle cx="345" cy="178" r="6" fill="#2b2b2b"/><circle cx="375" cy="178" r="6" fill="#2b2b2b"/>
    <circle cx="347" cy="176" r="2" fill="#fff"/><circle cx="377" cy="176" r="2" fill="#fff"/>
    <circle cx="337" cy="192" r="6" fill="#f4a6a0" opacity=".7"/>
    <circle cx="383" cy="192" r="6" fill="#f4a6a0" opacity=".7"/>
    <path d="M351 192 q9 10 18 0" fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
    <path d="M360 300 q-6 8 0 12 q6 -4 0 -12z" fill="#8fd3bf"/>
  </g>

  <!-- 子ども -->
  <g>
    <ellipse cx="550" cy="278" rx="62" ry="46" fill="#8fc1e8"/>
    <path d="M550 242 L550 300" stroke="#6fa8d3" stroke-width="3"/>
    <circle cx="550" cy="190" r="48" fill="#ffe3cc"/>
    <path d="M500 188 q-2 -58 50 -58 q52 0 50 58 q-18 -24 -50 -24 q-32 0 -50 24z" fill="#5a3a2a"/>
    <circle cx="534" cy="194" r="5" fill="#2b2b2b"/><circle cx="566" cy="194" r="5" fill="#2b2b2b"/>
    <circle cx="536" cy="192" r="1.8" fill="#fff"/><circle cx="568" cy="192" r="1.8" fill="#fff"/>
    <circle cx="520" cy="208" r="7" fill="#f4a6a0" opacity=".6"/>
    <circle cx="580" cy="208" r="7" fill="#f4a6a0" opacity=".6"/>
    <path d="M541 208 q9 10 18 0" fill="none" stroke="#5a3a2a" stroke-width="3" stroke-linecap="round"/>
    <!-- 頬の絆創膏 -->
    <g transform="translate(586 212) rotate(30)">
      <rect x="-12" y="-5" width="24" height="10" rx="5" fill="#f7d9a8" stroke="#e3c26a" stroke-width="1.2"/>
      <rect x="-4" y="-5" width="8" height="10" fill="#fff4d6"/>
    </g>
    <!-- ピース -->
    <circle cx="610" cy="262" r="13" fill="#ffe3cc"/>
    <rect x="605" y="236" width="6" height="22" rx="3" fill="#ffe3cc"/>
    <rect x="613" y="238" width="6" height="20" rx="3" fill="#ffe3cc"/>
  </g>
</svg>
