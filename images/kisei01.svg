  <path d="M688 106 q-6 -10 0 -18 q5 -8 -1 -16 M697 107 q5 -9 0 -16 q-4 -7 2 -14" fill="none" stroke="#c9bba8" stroke-width="3.5" stroke-linecap="round" opacity=".8"/>
  <g fill="#ffffff">
    <circle cx="572" cy="62" r="3.5"/><circle cx="604" cy="84" r="3"/><circle cx="628" cy="58" r="3.5"/>
    <circle cx="676" cy="70" r="3"/><circle cx="718" cy="56" r="3.5"/><circle cx="734" cy="90" r="3"/>
    <circle cx="590" cy="104" r="2.5"/><circle cx="660" cy="96" r="2.5"/><circle cx="706" cy="88" r="2.5"/>
  </g>
  <path d="M650 40 V200 M550 120 H750" stroke="#c9a77a" stroke-width="5"/>

  <!-- 棚と鏡もち -->
