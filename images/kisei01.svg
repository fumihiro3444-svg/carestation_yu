<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="お正月、窓の外に雪の阿蘇の山が見える居間で、帰省した息子さんとお母さんがこたつに入り、みかんとお茶を前に笑顔で話しているイラスト。床には帰省のかばん、棚には鏡もち">
