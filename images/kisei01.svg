  <circle cx="386" cy="276" r="13" fill="#f2a64a"/>
  <circle cx="412" cy="276" r="13" fill="#f2a64a"/>
  <circle cx="399" cy="262" r="12" fill="#f5b25c"/>
  <path d="M399 250 q3 -5 8 -4" fill="none" stroke="#6aa57a" stroke-width="3" stroke-linecap="round"/>
