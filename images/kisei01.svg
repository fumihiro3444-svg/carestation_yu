  <rect x="98" y="176" width="74" height="20" rx="3" fill="#ffffff" stroke="#e2c9a0" stroke-width="3"/>
  <ellipse cx="135" cy="166" rx="34" ry="14" fill="#ffffff" stroke="#e8dcc8" stroke-width="3"/>
  <ellipse cx="135" cy="148" rx="25" ry="11" fill="#ffffff" stroke="#e8dcc8" stroke-width="3"/>
  <circle cx="135" cy="132" r="9" fill="#f2a64a"/>
  <path d="M135 123 q4 -7 10 -6" fill="none" stroke="#6aa57a" stroke-width="3" stroke-linecap="round"/>
  <path d="M104 178 L166 178" stroke="#d98a6a" stroke-width="4"/>

  <!-- 床の影 -->
  <ellipse cx="400" cy="398" rx="290" ry="16" fill="#2f6f5e" opacity=".08"/>

