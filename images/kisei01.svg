  <path d="M465 179 q6 -7 12 0 M483 179 q6 -7 12 0" fill="none" stroke="#5a3a2a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="461" cy="188" r="5.5" fill="#f4a6a0" opacity=".6"/>
  <circle cx="499" cy="188" r="5.5" fill="#f4a6a0" opacity=".6"/>
  <path d="M472 192 q8 7 16 0" fill="none" stroke="#c0705a" stroke-width="3" stroke-linecap="round"/>

  <!-- 会話のハート -->
  <path transform="translate(400 150) scale(0.8)" d="M0 6 C-10 -4 -20 6 -10 16 L0 26 L10 16 C20 6 10 -4 0 6Z" fill="#f4a6a0"/>
  <path transform="translate(384 122) scale(0.45)" d="M0 6 C-10 -4 -20 6 -10 16 L0 26 L10 16 C20 6 10 -4 0 6Z" fill="#f4c2bd"/>

