  <path d="M340 260 q-4 -6 0 -12 M350 260 q4 -6 0 -12" fill="none" stroke="#d6cbbd" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M442 268 L446 290 L464 290 L468 268Z" fill="#ffffff" stroke="#e2c9a0" stroke-width="2.5"/>
  <path d="M450 260 q-4 -6 0 -12 M460 260 q4 -6 0 -12" fill="none" stroke="#d6cbbd" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 帰省のかばん -->
  <rect x="616" y="318" width="96" height="68" rx="12" fill="#6f9fb0"/>
  <rect x="616" y="318" width="96" height="68" rx="12" fill="none" stroke="#5c8a9a" stroke-width="3"/>
  <path d="M646 318 V306 Q646 298 654 298 H674 Q682 298 682 306 V318" fill="none" stroke="#5c8a9a" stroke-width="6" stroke-linecap="round"/>
  <path d="M616 346 H712" stroke="#5c8a9a" stroke-width="3"/>
  <rect x="656" y="340" width="16" height="12" rx="3" fill="#f2d98a"/>
  <rect x="690" y="328" width="14" height="20" rx="3" fill="#ffffff" opacity=".85"/>
</svg>
