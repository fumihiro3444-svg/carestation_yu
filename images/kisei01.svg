    <circle cx="460" cy="362" r="7"/><circle cx="512" cy="338" r="7"/><circle cx="270" cy="372" r="6"/><circle cx="532" cy="374" r="6"/>
  </g>
  <rect x="222" y="290" width="356" height="16" rx="6" fill="#c9a77a"/>
  <rect x="222" y="290" width="356" height="5" rx="3" fill="#d8bb92"/>

