<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf9f4"/>
      <stop offset="100%" stop-color="#f5ece4"/>
    </linearGradient>
    <linearGradient id="personA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a8c6c"/>
      <stop offset="100%" stop-color="#4a7c5e"/>
    </linearGradient>
    <linearGradient id="personB" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c07a50"/>
      <stop offset="100%" stop-color="#a8663f"/>
    </linearGradient>
    <linearGradient id="personC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a9cc4"/>
      <stop offset="100%" stop-color="#5c80a8"/>
    </linearGradient>
    <linearGradient id="wheelchairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf6ee"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- soft decorative circles -->
  <circle cx="90" cy="70" r="90" fill="#4a7c5e" opacity="0.06"/>
  <circle cx="720" cy="390" r="110" fill="#c07a50" opacity="0.06"/>
  <circle cx="700" cy="70" r="46" fill="#7a9cc4" opacity="0.08"/>

  <!-- gentle horizon -->
  <path d="M0,370 Q150,345 300,365 Q450,340 600,365 Q700,350 800,365 L800,450 L0,450 Z"
        fill="#e6f0ea" opacity="0.5"/>

  <!-- connecting arcs between the three figures, symbolizing collaboration -->
  <g fill="none" stroke="#c9bda6" stroke-width="2.5" stroke-dasharray="6,7" opacity="0.7">
    <path d="M180,230 Q400,150 620,230"/>
    <path d="M180,230 Q400,340 620,230"/>
  </g>

  <!-- central wheelchair / equipment icon -->
  <g transform="translate(345,230)">
    <ellipse cx="55" cy="145" rx="80" ry="14" fill="#2e2820" opacity="0.06"/>
    <!-- seat -->
    <rect x="20" y="40" width="70" height="55" rx="8" fill="url(#wheelchairGrad)" stroke="#e6dccb" stroke-width="2.5"/>
    <!-- backrest -->
    <rect x="20" y="0" width="70" height="45" rx="8" fill="url(#wheelchairGrad)" stroke="#e6dccb" stroke-width="2.5"/>
    <!-- big wheel -->
    <circle cx="30" cy="120" r="34" fill="none" stroke="#c9bda6" stroke-width="6"/>
    <circle cx="30" cy="120" r="4" fill="#c9bda6"/>
    <!-- small front wheel -->
    <circle cx="95" cy="130" r="12" fill="none" stroke="#c9bda6" stroke-width="5"/>
    <!-- armrest -->
    <rect x="8" y="55" width="12" height="45" rx="5" fill="#e6dccb"/>
  </g>

  <!-- cane leaning nearby, small accent -->
  <g transform="translate(300,260) rotate(18)">
    <rect x="0" y="0" width="7" height="110" rx="3.5" fill="#c07a50"/>
    <path d="M0,0 Q-10,-10 0,-18 Q10,-10 7,0 Z" fill="#a8663f"/>
  </g>

  <!-- Person A: care manager, left -->
  <g transform="translate(90,175)">
    <circle cx="35" cy="30" r="26" fill="#f0ddc4"/>
    <path d="M9,26 Q12,4 35,2 Q58,4 61,26 Q52,14 35,13 Q18,14 9,26 Z" fill="#5c4a3a"/>
    <path d="M8,150 Q12,80 35,72 Q58,80 62,150 Z" fill="url(#personA)"/>
    <rect x="20" y="95" width="30" height="8" rx="4" fill="#eef6f0" opacity="0.5"/>
  </g>
  <text x="125" y="345" font-family="Zen Kaku Gothic New, sans-serif" font-size="15" fill="#4a7c5e" text-anchor="middle" font-weight="700">ケアマネジャー</text>

  <!-- Person B: fukushiyougu specialist, center-right of wheelchair -->
  <g transform="translate(560,175)">
    <circle cx="35" cy="30" r="26" fill="#f0ddc4"/>
    <path d="M9,26 Q12,4 35,2 Q58,4 61,26 Q52,14 35,13 Q18,14 9,26 Z" fill="#3a2e22"/>
    <path d="M8,150 Q12,80 35,72 Q58,80 62,150 Z" fill="url(#personB)"/>
    <rect x="20" y="95" width="30" height="8" rx="4" fill="#eef6f0" opacity="0.5"/>
  </g>
  <text x="596" y="345" font-family="Zen Kaku Gothic New, sans-serif" font-size="15" fill="#a8663f" text-anchor="middle" font-weight="700">福祉用具専門相談員</text>

  <!-- Person C: rehab professional, top center-back -->
  <g transform="translate(360,60)">
    <circle cx="35" cy="30" r="24" fill="#f0ddc4"/>
    <path d="M11,26 Q14,6 35,4 Q56,6 59,26 Q50,15 35,14 Q20,15 11,26 Z" fill="#5c4a3a"/>
    <path d="M10,130 Q14,68 35,60 Q56,68 60,130 Z" fill="url(#personC)"/>
    <rect x="22" y="82" width="26" height="7" rx="3.5" fill="#eef6f0" opacity="0.5"/>
  </g>
  <text x="395" y="205" font-family="Zen Kaku Gothic New, sans-serif" font-size="14" fill="#5c80a8" text-anchor="middle" font-weight="700">リハビリ職（病院）</text>

  <!-- leaf accents -->
  <g opacity="0.5">
    <path d="M700,90 Q712,68 738,66 Q728,90 700,90 Z" fill="#4a7c5e"/>
    <path d="M70,400 Q80,378 106,376 Q96,398 70,400 Z" fill="#6a9e7e"/>
  </g>
</svg>
