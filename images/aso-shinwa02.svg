<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfe0e8"/>
      <stop offset="60%" stop-color="#e6f4ee"/>
      <stop offset="100%" stop-color="#fdf9f4"/>
    </linearGradient>
    <linearGradient id="mtFarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9dc2b0"/>
      <stop offset="100%" stop-color="#7fb096"/>
    </linearGradient>
    <linearGradient id="mtNearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a9e7e"/>
      <stop offset="100%" stop-color="#4a7c5e"/>
    </linearGradient>
    <linearGradient id="paddyGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfe0c8"/>
      <stop offset="100%" stop-color="#9dd0ac"/>
    </linearGradient>
    <linearGradient id="paddyGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8d4b4"/>
      <stop offset="100%" stop-color="#86c294"/>
    </linearGradient>
    <linearGradient id="paddyGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94c8a0"/>
      <stop offset="100%" stop-color="#6fb480"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <!-- soft sun -->
  <circle cx="660" cy="80" r="40" fill="#ffe6c2" opacity="0.9"/>
  <circle cx="660" cy="80" r="60" fill="#ffe6c2" opacity="0.3"/>

  <!-- soft clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="150" cy="70" rx="55" ry="16"/>
    <ellipse cx="195" cy="62" rx="38" ry="14"/>
    <ellipse cx="110" cy="62" rx="32" ry="12"/>

    <ellipse cx="430" cy="45" rx="45" ry="13"/>
    <ellipse cx="465" cy="40" rx="30" ry="11"/>
  </g>

  <!-- far mountain range (Aso outer rim, soft) -->
  <path d="M0,190 Q90,150 160,175 Q220,140 300,170 Q370,145 430,175 Q500,150 570,178 Q650,155 720,180 Q770,170 800,178 L800,230 L0,230 Z"
        fill="url(#mtFarGrad)" opacity="0.65"/>

  <!-- Aso gogaku silhouette (near range), gentle recognizable peaks -->
  <path d="M0,225
           L60,225 L100,170 L130,200 L170,150 L200,190
           L240,140 L260,175 L300,120 L330,180
           L370,160 L400,225 Z"
        fill="url(#mtNearGrad)"/>
  <path d="M400,225 L470,225 L520,175 L560,210 L610,160 L660,225 L800,225 L800,235 L0,235 Z"
        fill="url(#mtNearGrad)" opacity="0.9"/>

  <!-- gentle haze at mountain base -->
  <rect x="0" y="215" width="800" height="30" fill="#eef6f0" opacity="0.5"/>

  <!-- rice paddy terraces filling the foreground -->
  <g>
    <path d="M0,245 L800,240 L800,285 L0,292 Z" fill="url(#paddyGrad1)"/>
    <path d="M0,292 L800,285 L800,335 L0,344 Z" fill="url(#paddyGrad2)"/>
    <path d="M0,344 L800,335 L800,390 L0,400 Z" fill="url(#paddyGrad1)"/>
    <path d="M0,400 L800,390 L800,450 L0,450 Z" fill="url(#paddyGrad3)"/>

    <!-- terrace dividers -->
    <path d="M0,245 L800,240" stroke="#ffffff" stroke-width="2.5" opacity="0.5"/>
    <path d="M0,292 L800,285" stroke="#ffffff" stroke-width="2.5" opacity="0.5"/>
    <path d="M0,344 L800,335" stroke="#ffffff" stroke-width="2.5" opacity="0.5"/>
    <path d="M0,400 L800,390" stroke="#ffffff" stroke-width="2.5" opacity="0.5"/>

    <!-- water sheen reflections -->
    <ellipse cx="130" cy="262" rx="60" ry="7" fill="#eaf6f3" opacity="0.55"/>
    <ellipse cx="560" cy="258" rx="70" ry="7" fill="#eaf6f3" opacity="0.5"/>
    <ellipse cx="330" cy="312" rx="55" ry="6" fill="#eaf6f3" opacity="0.5"/>
    <ellipse cx="680" cy="365" rx="60" ry="6" fill="#eaf6f3" opacity="0.45"/>
    <ellipse cx="200" cy="418" rx="65" ry="7" fill="#eaf6f3" opacity="0.45"/>

    <!-- subtle rice seedling rows -->
    <g stroke="#5aa070" stroke-width="1.5" opacity="0.35">
      <line x1="40" y1="270" x2="40" y2="280"/>
      <line x1="70" y1="272" x2="70" y2="282"/>
      <line x1="100" y1="270" x2="100" y2="280"/>
      <line x1="420" y1="360" x2="420" y2="372"/>
      <line x1="450" y1="362" x2="450" y2="374"/>
      <line x1="480" y1="360" x2="480" y2="372"/>
    </g>
  </g>

  <!-- a single white heron, quiet accent -->
  <g transform="translate(600,300)">
    <path d="M0,22 Q6,2 22,-4 Q15,5 13,11 Q24,7 30,-2 Q28,11 15,17 Q24,19 30,17 Q19,28 6,24 Q4,30 0,32 Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="22" cy="-3" r="2.2" fill="#8a7560"/>
    <line x1="4" y1="28" x2="2" y2="40" stroke="#c9bda6" stroke-width="2"/>
    <line x1="9" y1="29" x2="10" y2="40" stroke="#c9bda6" stroke-width="2"/>
  </g>
</svg>
