<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf9f4"/>
      <stop offset="100%" stop-color="#f5ece4"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c9bda6"/>
      <stop offset="100%" stop-color="#b8aa8f"/>
    </linearGradient>
    <linearGradient id="clothesGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a8c6c"/>
      <stop offset="100%" stop-color="#4a7c5e"/>
    </linearGradient>
    <linearGradient id="clipboardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdf6ee"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>

  <!-- soft decorative circles -->
  <circle cx="90" cy="80" r="90" fill="#4a7c5e" opacity="0.06"/>
  <circle cx="720" cy="380" r="110" fill="#c07a50" opacity="0.06"/>

  <!-- gentle horizon -->
  <path d="M0,360 Q150,335 300,355 Q450,330 600,355 Q700,340 800,355 L800,450 L0,450 Z"
        fill="#e6f0ea" opacity="0.5"/>

  <!-- thought bubble, upper right -->
  <g transform="translate(560,60)">
    <circle cx="0" cy="60" r="8" fill="#ffffff" stroke="#e6dccb" stroke-width="2"/>
    <circle cx="20" cy="40" r="12" fill="#ffffff" stroke="#e6dccb" stroke-width="2"/>
    <ellipse cx="90" cy="0" rx="110" ry="72" fill="#ffffff" stroke="#e6dccb" stroke-width="2.5"/>
    <text x="90" y="18" font-family="Shippori Mincho, serif" font-size="52" font-weight="700" fill="#c07a50" text-anchor="middle">？</text>
  </g>

  <!-- small house icon inside thought bubble area, subtle -->
  <g transform="translate(500,50)" opacity="0.55">
    <path d="M0,20 L18,4 L36,20 L36,40 L0,40 Z" fill="#8fc9bd"/>
    <rect x="14" y="26" width="8" height="14" fill="#4a7c5e"/>
  </g>

  <!-- desk -->
  <rect x="60" y="330" width="420" height="18" rx="4" fill="url(#deskGrad)"/>
  <rect x="80" y="348" width="16" height="70" fill="#a8987a"/>
  <rect x="440" y="348" width="16" height="70" fill="#a8987a"/>

  <!-- seated care-manager figure (faceless, gentle silhouette style) -->
  <g transform="translate(150,150)">
    <!-- chair back, subtle -->
    <rect x="30" y="60" width="90" height="130" rx="20" fill="#e6dccb" opacity="0.4"/>

    <!-- body / jacket -->
    <path d="M35,180 Q40,110 75,100 Q110,110 115,180 Z" fill="url(#clothesGrad)"/>

    <!-- head, simple rounded shape, no facial detail -->
    <circle cx="75" cy="60" r="34" fill="#f0ddc4"/>
    <path d="M41,55 Q45,20 75,18 Q105,20 109,55 Q100,38 75,36 Q50,38 41,55 Z" fill="#5c4a3a"/>

    <!-- gentle tilted head posture line (thinking pose), hand near chin -->
    <path d="M95,72 Q108,78 106,92 Q104,100 96,98" fill="none" stroke="#f0ddc4" stroke-width="10" stroke-linecap="round"/>

    <!-- arm resting on desk -->
    <path d="M40,150 Q20,165 22,182" fill="none" stroke="url(#clothesGrad)" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- clipboard on desk, with review checklist -->
  <g transform="translate(230,255)">
    <rect x="0" y="0" width="140" height="90" rx="8" fill="url(#clipboardGrad)" stroke="#e6dccb" stroke-width="2"/>
    <rect x="50" y="-8" width="40" height="14" rx="6" fill="#c9bda6"/>
    <rect x="14" y="18" width="80" height="8" rx="4" fill="#e6dccb"/>
    <rect x="14" y="34" width="100" height="8" rx="4" fill="#e6dccb"/>
    <rect x="14" y="50" width="70" height="8" rx="4" fill="#e6dccb"/>

    <!-- checkboxes -->
    <rect x="112" y="16" width="12" height="12" rx="2" fill="none" stroke="#6a9e7e" stroke-width="2"/>
    <path d="M114,22 L118,26 L124,17" fill="none" stroke="#4a7c5e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="112" y="48" width="12" height="12" rx="2" fill="none" stroke="#c9bda6" stroke-width="2"/>
  </g>

  <!-- pencil beside clipboard -->
  <g transform="translate(390,300) rotate(35)">
    <rect x="0" y="0" width="60" height="9" rx="4" fill="#c07a50"/>
    <path d="M60,0 L74,4.5 L60,9 Z" fill="#f0ddc4"/>
    <rect x="-6" y="0" width="8" height="9" fill="#a8663f"/>
  </g>

  <!-- cup of tea, small warm touch -->
  <g transform="translate(60,270)">
    <path d="M0,10 L36,10 L32,36 Q18,44 4,36 Z" fill="#ffffff" stroke="#e6dccb" stroke-width="2"/>
    <ellipse cx="18" cy="10" rx="18" ry="5" fill="#c07a50" opacity="0.5"/>
    <path d="M36,16 Q48,16 46,26 Q44,34 34,30" fill="none" stroke="#e6dccb" stroke-width="3"/>
  </g>

  <!-- leaf accents -->
  <g opacity="0.5">
    <path d="M700,90 Q712,68 738,66 Q728,90 700,90 Z" fill="#4a7c5e"/>
    <path d="M80,400 Q90,378 116,376 Q106,398 80,400 Z" fill="#6a9e7e"/>
  </g>
</svg>
