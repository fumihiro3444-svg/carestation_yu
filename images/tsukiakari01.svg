<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyNight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1c2947"/>
      <stop offset="45%"  stop-color="#2e3d63"/>
      <stop offset="78%"  stop-color="#4c4d72"/>
      <stop offset="100%" stop-color="#6a5a72"/>
    </linearGradient>
    <radialGradient id="moonGrad" cx="42%" cy="38%" r="65%">
      <stop offset="0%"   stop-color="#fffaf0"/>
      <stop offset="60%"  stop-color="#fdf0c8"/>
      <stop offset="100%" stop-color="#f0d79a"/>
    </radialGradient>
    <radialGradient id="windowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffdd9a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffdd9a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#33475a"/>
      <stop offset="100%" stop-color="#293c4d"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#213145"/>
      <stop offset="100%" stop-color="#182535"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#skyNight)"/>

  <!-- stars -->
  <g fill="#fdf9f4">
    <circle cx="70" cy="60" r="1.6" opacity="0.75"/>
    <circle cx="140" cy="110" r="1.2" opacity="0.55"/>
    <circle cx="230" cy="55" r="1.8" opacity="0.7"/>
    <circle cx="310" cy="130" r="1.3" opacity="0.5"/>
    <circle cx="120" cy="180" r="1.4" opacity="0.6"/>
    <circle cx="40" cy="150" r="1.1" opacity="0.5"/>
    <circle cx="670" cy="70" r="1.5" opacity="0.65"/>
    <circle cx="720" cy="140" r="1.2" opacity="0.55"/>
    <circle cx="750" cy="90" r="1.7" opacity="0.7"/>
    <circle cx="620" cy="180" r="1.2" opacity="0.5"/>
    <circle cx="440" cy="60" r="1.3" opacity="0.55"/>
    <circle cx="480" cy="230" r="1.1" opacity="0.4"/>
    <circle cx="190" cy="230" r="1.1" opacity="0.4"/>
  </g>

  <!-- moon glow -->
  <circle cx="520" cy="128" r="105" fill="#fdf0c8" opacity="0.08"/>
  <circle cx="520" cy="128" r="85"  fill="#fdf0c8" opacity="0.12"/>
  <circle cx="520" cy="128" r="68"  fill="#fdf0c8" opacity="0.16"/>

  <!-- moon -->
  <circle cx="520" cy="128" r="54" fill="url(#moonGrad)"/>
  <g fill="#e3c98f" opacity="0.35">
    <ellipse cx="502" cy="112" rx="10" ry="7"/>
    <ellipse cx="536" cy="132" rx="14" ry="9"/>
    <ellipse cx="512" cy="150" rx="7" ry="5"/>
  </g>

  <!-- clouds drifting across the moon -->
  <g fill="#eef1f6" opacity="0.62">
    <ellipse cx="470" cy="150" rx="60" ry="20"/>
    <ellipse cx="515" cy="158" rx="70" ry="24"/>
    <ellipse cx="565" cy="148" rx="50" ry="17"/>
  </g>
  <g fill="#eef1f6" opacity="0.4">
    <ellipse cx="600" cy="95" rx="46" ry="14"/>
    <ellipse cx="635" cy="100" rx="34" ry="11"/>
  </g>
  <g fill="#eef1f6" opacity="0.3">
    <ellipse cx="150" cy="90" rx="55" ry="15"/>
    <ellipse cx="195" cy="96" rx="38" ry="12"/>
  </g>

  <!-- back hills (Aso silhouette) -->
  <path d="M0,300 C90,260 160,290 240,265 C320,240 380,275 470,255 C560,235 620,270 700,250 C750,238 780,255 800,248 L800,450 L0,450 Z" fill="url(#hillBack)"/>

  <!-- front hills -->
  <path d="M0,340 C100,310 190,345 280,320 C370,295 440,335 540,318 C630,302 690,330 800,312 L800,450 L0,450 Z" fill="url(#hillFront)"/>

  <!-- susuki grass silhouettes -->
  <g stroke="#152232" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M60,360 C58,335 66,318 62,300"/>
    <path d="M60,360 C64,338 60,320 68,304"/>
    <path d="M60,360 C56,340 50,326 44,312"/>
    <path d="M740,370 C738,345 748,326 744,308"/>
    <path d="M740,370 C744,348 740,330 750,314"/>
    <path d="M740,370 C736,350 728,336 720,322"/>
  </g>

  <!-- small house on the hill, one warm lit window -->
  <g>
    <circle cx="330" cy="352" r="34" fill="url(#windowGlow)"/>
    <rect x="300" y="335" width="60" height="42" fill="#182535"/>
    <polygon points="294,335 330,308 366,335" fill="#182535"/>
    <rect x="337" y="340" width="14" height="14" rx="1.5" fill="#ffe3a3"/>
    <rect x="309" y="352" width="16" height="25" fill="#0f1a26"/>
    <line x1="352" y1="317" x2="352" y2="303" stroke="#182535" stroke-width="4"/>
    <path d="M352,303 C358,297 356,289 350,285" stroke="#cfd4dd" stroke-width="2.4" fill="none" opacity="0.5" stroke-linecap="round"/>
  </g>

</svg>
